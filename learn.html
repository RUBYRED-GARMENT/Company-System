<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rubyred L&D</title>
<style>
:root{--bg:#0a0608;--card:#150b0f;--card2:#1d1015;--line:#2e1a21;--red:#a50f26;--red2:#e11d48;--tx:#f4eaec;--mu:#a58f95;--ok:#3ddc97;--warn:#f5b942}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.55 "Segoe UI",system-ui,sans-serif;min-height:100vh}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 400px at 85% -5%,rgba(165,15,38,.35),transparent),radial-gradient(500px 400px at 0 100%,rgba(165,15,38,.22),transparent);animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-30px,20px) scale(1.06)}}
aside{position:fixed;inset:0 auto 0 0;width:232px;background:rgba(21,11,15,.92);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;z-index:5}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:.3px;margin-bottom:22px;padding:0 8px}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--red2),var(--red));display:grid;place-items:center;font-style:normal;box-shadow:0 0 22px rgba(225,29,72,.55);animation:pulse 3s infinite}
@keyframes pulse{50%{box-shadow:0 0 6px rgba(225,29,72,.3)}}
.logo small{display:block;font-weight:400;font-size:11px;color:var(--mu)}
nav button{all:unset;cursor:pointer;display:flex;gap:11px;align-items:center;padding:10px 12px;border-radius:10px;color:var(--mu);width:calc(100% - 24px);transition:.2s}
nav button:hover{background:var(--card2);color:var(--tx)}
nav button.on{background:linear-gradient(90deg,rgba(225,29,72,.28),transparent);color:#fff;box-shadow:inset 3px 0 var(--red2)}
nav button:focus-visible,.btn:focus-visible{outline:2px solid var(--red2);outline-offset:2px}
main{margin-left:232px;padding:26px 32px 50px;max-width:1300px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
h1{font-size:26px}h2{font-size:17px;margin-bottom:12px}h3{font-size:15px}
.sub{color:var(--mu);font-size:13px}
.view{animation:up .45s ease}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.grid{display:grid;gap:16px}.g5{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.g3{grid-template-columns:320px 1fr}
.card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:18px;transition:.25s}
.card:hover{border-color:#5a1b29}
.kpi b{display:block;font-size:32px;font-weight:700;background:linear-gradient(90deg,#fff,#ff6b86);-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi span{color:var(--mu);font-size:13px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--card2);color:var(--tx);padding:8px 14px;border-radius:10px;font:inherit;font-size:13px;transition:.2s}
.btn:hover{border-color:var(--red2);transform:translateY(-1px)}
.btn.p{background:linear-gradient(135deg,var(--red2),var(--red));border:0;box-shadow:0 6px 20px rgba(165,15,38,.45)}
input,select{background:#0f080b;border:1px solid var(--line);color:var(--tx);padding:8px 10px;border-radius:9px;font:inherit;font-size:13px}
input[type=range]{accent-color:var(--red2);padding:0;width:100%}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{color:var(--mu);font-weight:600;text-align:start;padding:9px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid #22131a}
tr:hover td{background:rgba(225,29,72,.05)}
.tw{overflow-x:auto}
.badge{padding:2px 9px;border-radius:20px;font-size:12px;border:1px solid}
.hi{color:#ff5d7a;border-color:#ff5d7a}.me{color:var(--warn);border-color:var(--warn)}.lo{color:var(--ok);border-color:var(--ok)}
.bar{height:9px;background:#26141b;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--red),var(--red2));transform-origin:left;animation:grow 1s cubic-bezier(.2,.8,.2,1)}
@keyframes grow{from{transform:scaleX(0)}}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.list{display:flex;flex-direction:column;gap:6px;max-height:560px;overflow:auto}
.item{padding:10px 12px;border-radius:11px;cursor:pointer;border:1px solid transparent;background:#12090d;transition:.2s}
.item:hover{border-color:#5a1b29}.item.on{border-color:var(--red2);background:rgba(225,29,72,.12)}
.donut{width:150px;height:150px;border-radius:50%;margin:auto;display:grid;place-items:center;animation:spin 1.2s ease}
.donut div{width:98px;height:98px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:700;font-size:22px}
@keyframes spin{from{transform:rotate(-120deg);opacity:0}}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lang button{all:unset;cursor:pointer;padding:7px 14px;font-size:13px;color:var(--mu)}
.lang button.on{background:var(--red);color:#fff}
.doc h3{margin:16px 0 6px;color:#ff8da1}.doc li{margin-left:20px;margin-bottom:3px}
.hm td{text-align:center;font-weight:600}
.lv{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;align-items:center;margin-bottom:12px}
@media(max-width:860px){aside{position:static;width:auto;flex-direction:row;flex-wrap:wrap;padding:10px}.logo{width:100%;margin:0 0 6px}nav button{width:auto}main{margin:0;padding:18px}.g3{grid-template-columns:1fr}}
@media(min-width:861px){[dir=rtl] aside{inset:0 0 0 auto;border-right:0;border-left:1px solid var(--line)}[dir=rtl] main{margin-left:0;margin-right:232px}}
[dir=rtl] nav button.on{box-shadow:inset -3px 0 var(--red2);background:linear-gradient(270deg,rgba(225,29,72,.28),transparent)}[dir=rtl] .doc li{margin:0 20px 3px 0}
.stack{display:flex;height:10px;border-radius:9px;overflow:hidden;background:#26141b}.stack i{display:block;height:100%;transition:width .8s}
.tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.tl>div{background:#10080b;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:90px}
.chip{padding:6px 9px;border-radius:9px;background:#1a0e13;border-inline-start:3px solid var(--red2);font-size:12.5px;margin-bottom:6px}
.opt{display:block;position:relative;cursor:pointer;margin-bottom:6px}.opt input{position:absolute;opacity:0}
.opt span{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:#12090d;transition:.2s}.opt b{color:#ff8da1}
.opt:hover span{border-color:var(--red2)}.opt input:checked+span{border-color:var(--red2);background:rgba(225,29,72,.16)}.opt input:focus-visible+span{outline:2px solid var(--red2)}
.emp aside,.emp #rst,.emp #syn{display:none}.emp main{margin:0 auto;max-width:900px}
.pills{display:flex;gap:6px}.pill{position:relative;cursor:pointer}.pill input{position:absolute;opacity:0}
.pill span{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#12090d;transition:.2s}
.pill:hover span{border-color:var(--red2)}.pill input:checked+span{background:linear-gradient(135deg,var(--red2),var(--red));border-color:transparent;transform:scale(1.08)}.pill input:focus-visible+span{outline:2px solid var(--red2)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{aside,.top .btn,.noprint{display:none!important}body{background:#fff;color:#000}body:before{display:none}main{margin:0}.card{background:#fff;border:0;color:#000}.doc h3{color:#8a0e22}}
</style></head><body>

setup(){return `<div class=card><h2>${t("setup")}</h2><p class=sub style="margin-bottom:10px">SHEET_URL: ${SHEET_URL?"✓":"—"}</p><ol style="margin-left:20px;margin-bottom:14px">${(SETUP[li()]||SETUP[0]).map(x=>`<li>${x}</li>`).join("")}</ol><div class="row noprint" style="justify-content:flex-start;margin-bottom:8px"><button class="btn p" onclick="navigator.clipboard.writeText(GS);this.textContent=t('copied')">${t("copy")}</button><button class=btn onclick="sync()">${t("sync")}</button></div><pre style="background:#0f080b;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font-size:12px;max-height:340px">${esc(GS)}</pre></div>`}});
function prog(){const n=document.querySelectorAll("#v input[type=radio]:checked").length;$("#pg").style.width=n/16*100+"%";$("#pgt").textContent=n+"/16 "+t("prog2")}
function applyRes(r){r.code=String(r.code);const sc={};C.forEach(c=>sc[c[0]]=Math.max(1,Math.min(5,+r.sc[c[0]]||3)));r.sc=sc;
S.res=S.res.filter(x=>x.code!=r.code);S.res.push(r);
let e=S.emps.find(x=>x.code==r.code);const L=/manager|lead|supervisor|müdür|şef|yönetici/i.test(r.title);
if(!e){e={id:S.n++,code:r.code,cur:{},req:{}};C.forEach(c=>e.req[c[0]]=c[0]=="lead"?(L?4:2):(L?4:3));S.emps.push(e)}
e.name=r.name;e.dept=r.dept||e.dept||"—";e.role=r.title;C.forEach(c=>e.cur[c[0]]=sc[c[0]])}
function submitAsmt(){const f=id=>$("#"+id).value.trim(),code=f("ac"),name=f("an"),title=f("at");
if(!code||!name||!title)return alert(t("fill"));
const sc={};let miss=0;C.forEach(c=>{const v=Q[c[0]].map((q,i)=>{const el=document.querySelector("input[name="+c[0]+i+"]:checked");if(!el){miss=1;return 0}return q[2][+el.value]});sc[c[0]]=Math.max(1,Math.min(5,Math.round(1+(avg(v)-1)*4/3)))});
if(miss)return alert(t("fillq"));
const r={code,name,title,dept:$("#ad").value,at:new Date().toISOString().slice(0,10),sc};
applyRes(r);save();
if(SHEET_URL)fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(r)}).catch(()=>{});
mine=r;render()}
async function sync(q){if(!SHEET_URL)return q||alert(t("nourl"));try{const rows=await(await fetch(SHEET_URL)).json();rows.forEach(applyRes);save();render()}catch(e){q||alert("Sync failed: "+e.message)}}
function auth(){if(document.body.className=="emp"){const p=prompt(t("pin"));if(p===null)return;if(p!==ADMIN_PIN)return alert(t("badpin"));sessionStorage.rr_adm="1";document.body.className="";cur="dash";render();if(SHEET_URL)sync(true)}else{sessionStorage.rr_adm="";document.body.className="emp";mine=null;render()}}
function go(v){cur=v;render()}
function render(){const em=document.body.className=="emp";if(em)cur="asmt";document.documentElement.lang=lang;document.documentElement.dir=lang=="ar"?"rtl":"ltr";$("#sub").textContent=t("app");$("#ttl").textContent=(em?"Rubyred · ":"")+t(cur);$("#dt").textContent=em?t("app"):t("save");$("#rst").textContent=t("reset");$("#syn").textContent=t("sync");$("#lg").textContent=em?t("login"):t("logout");
$("#l-en").className=lang=="en"?"on":"";$("#l-tr").className=lang=="tr"?"on":"";$("#l-ar").className=lang=="ar"?"on":"";
const ic={dash:"◧",emps:"☻",tna:"✦",cat:"▤",plan:"▦",mat:"✎",rep:"◔",asmt:"✔",hub:"▶️",setup:"⚙"};
$("#nav").innerHTML=Object.keys(V).map(k=>`<button class="${k==cur?"on":""}" onclick="go('${k}')"><span>${ic[k]}</span>${t(k)}</button>`).join("");
$("#v").innerHTML=`<div class=view>${V[cur]()}</div>`;
document.querySelectorAll("[data-n]").forEach(el=>{const n=+el.dataset.n,s=el.dataset.s||"",t0=performance.now();(function f(now){const p=Math.min(1,(now-t0)/900);el.textContent=Math.round(n*(1-Math.pow(1-p,3)))+s;if(p<1)requestAnimationFrame(f)})(t0)})}
function setLang(l){lang=l;localStorage.rr_lang=l;render()}
function setLv(k,c,v){emp(sel)[k][c]=+v;save();render()}
function addEmp(){const n=$("#nn").value.trim();if(!n)return;const e={id:S.n++,name:n,dept:$("#nd").value,role:$("#nr").value,cur:{},req:{}};C.forEach(c=>{e.cur[c[0]]=3;e.req[c[0]]=3});S.emps.push(e);save();render()}
function delEmp(id){S.emps=S.emps.filter(e=>e.id!=id);S.plan=S.plan.filter(p=>p.e!=id);save();render()}
function upd(id,k,v){S.plan.find(p=>p.id==id)[k]=v;save();render()}
function autoPlan(){S.emps.forEach(e=>gaps(e).forEach(x=>addPlan(e.id,x.c,cohort(x.g>=2?1:3))));save();render()}
function resetData(){if(confirm(t("sure"))){seed();render()}}
function csv(){const rows=[["Employee","Code","Department","Training","Date","Hours","Cost","Status"],...S.plan.filter(p=>emp(p.e)).map(p=>{const e=emp(p.e),k=crs(p.k);return[e.name,e.code||"",e.dept,TN[k.id][0],p.d,hrs(k),cost(k),p.s]})];
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+rows.map(r=>r.map(c=>`"${c}"`).join(",")).join("\n")],{type:"text/csv"}));a.download="rubyred-training-plan.csv";a.click()}
if(sessionStorage.rr_adm!="1")document.body.className="emp";
render();if(SHEET_URL&&document.body.className!="emp")sync(true);
</script></body></html>
