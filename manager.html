<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="ruby">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>RUBYRED – Manager Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--p:#C0002A;--p2:#7A0020;--glow:#FF2C4D;--gold:#D4AF6A;--ok:#1FBE72;--warn:#E6B528;--bg:#07050A;--bg2:#0F0810;--s1:#180D14;--s2:#22121C;--bd:rgba(212,175,106,.16);--tx:#F7F0E8;--mu:#9C8A85;--ease:cubic-bezier(.16,1,.3,1)}
html[data-theme=ocean]{--p:#1D6FE0;--p2:#0B3A80;--glow:#4DA3FF;--bg:#050A14;--bg2:#09111F;--s1:#0E1930;--s2:#14233F}
html[data-theme=emerald]{--p:#14946B;--p2:#08573F;--glow:#2DE0A5;--bg:#040C09;--bg2:#08140F;--s1:#0D1F18;--s2:#132B22}
html[data-theme=royal]{--p:#7B3FE4;--p2:#43208F;--glow:#A878FF;--bg:#08050F;--bg2:#100A1C;--s1:#1A1230;--s2:#241A42}
html[data-theme=light]{--glow:#E0193F;--gold:#9C7A2E;--bg:#F6F1EC;--bg2:#FFF;--s1:#FFF;--s2:#F1E9E2;--bd:rgba(122,0,32,.15);--tx:#2A1218;--mu:#7C6A68}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden;transition:background .5s}
.aurora{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 45% at 15% -10%,color-mix(in srgb,var(--p) 28%,transparent),transparent 65%),radial-gradient(ellipse 50% 40% at 100% 90%,color-mix(in srgb,var(--p2) 30%,transparent),transparent 60%)}
.logo{width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--gold)}
.brand{font:900 1.2rem 'Playfair Display',serif;letter-spacing:.12em;background:linear-gradient(90deg,var(--tx),var(--gold),var(--glow));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:12px 24px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.top .sp{flex:1}.top small{display:block;font-size:.6rem;letter-spacing:.2em;color:var(--mu)}
.dots{display:flex;gap:7px}.dot{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:.2s}.dot.on{border-color:var(--tx)}
.lang{display:flex;border:1px solid var(--bd);border-radius:99px;overflow:hidden}.lang button{background:none;border:0;color:var(--mu);padding:5px 12px;font:700 .72rem Cairo;cursor:pointer}.lang button.on{background:var(--p);color:#fff}
.ghost{background:none;border:1px solid var(--bd);color:var(--mu);border-radius:8px;padding:7px 14px;font:600 .78rem Cairo;cursor:pointer;text-decoration:none;transition:.2s}.ghost:hover{border-color:var(--p);color:var(--glow)}
.wrap{position:relative;z-index:1}
#auth{min-height:calc(100vh - 70px);display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:420px;background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:34px 30px;box-shadow:0 30px 70px rgba(0,0,0,.4);animation:up .6s var(--ease)}
@keyframes up{from{opacity:0;transform:translateY(24px)}}
.tabs{display:flex;border:1px solid var(--bd);border-radius:8px;margin-bottom:22px;overflow:hidden}.tabs button{flex:1;padding:11px;border:0;background:none;color:var(--mu);font:700 .85rem Cairo;cursor:pointer}.tabs button.on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
.t{font:700 1.4rem 'Playfair Display',serif}.sub{font-size:.8rem;color:var(--mu);margin:4px 0 18px}
.f{margin-bottom:14px}.f label{display:block;font-size:.7rem;font-weight:700;letter-spacing:.08em;color:var(--gold);margin-bottom:6px}
.f input{width:100%;padding:12px 14px;background:var(--bg2);border:1px solid var(--bd);color:var(--tx);font:.95rem Cairo;border-radius:8px;outline:0}.f input:focus{border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 22%,transparent)}
.btn{width:100%;padding:13px;border:0;border-radius:8px;color:#fff;font:700 .92rem Cairo;cursor:pointer;background:linear-gradient(135deg,var(--p),var(--p2));transition:.25s}.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px color-mix(in srgb,var(--p) 45%,transparent)}.btn:disabled{opacity:.5}
.al{display:none;padding:11px 14px;margin-bottom:14px;border-radius:8px;font-size:.82rem;border-inline-start:3px solid var(--p);background:color-mix(in srgb,var(--p) 12%,transparent)}.al.show{display:block}.al.ok{border-color:var(--ok);background:rgba(31,190,114,.12)}
#dash{display:none;max-width:1150px;margin:0 auto;padding:24px}#dash.show{display:block;animation:up .5s var(--ease)}
.hero{padding:20px 24px;border-radius:16px;border:1px solid var(--bd);background:linear-gradient(135deg,var(--s2),color-mix(in srgb,var(--p) 18%,var(--s1)));margin-bottom:20px}
.hero h2{font:700 1.5rem 'Playfair Display',serif}.hero h2 b{color:var(--gold)}.hero p{color:var(--mu);font-size:.82rem;margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.st{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:16px;border-inline-start:3px solid var(--c);transition:.3s var(--ease);cursor:pointer}.st:hover{transform:translateY(-4px)}
.st .n{font:900 1.9rem 'Playfair Display',serif}.st .l{font-size:.72rem;color:var(--mu)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.bar input{flex:1;min-width:180px;padding:11px 14px;background:var(--s1);border:1px solid var(--bd);border-radius:10px;color:var(--tx);font:.9rem Cairo;outline:0}
.fl{display:flex;gap:8px;flex-wrap:wrap}.fl button{padding:8px 16px;border-radius:99px;border:1px solid var(--bd);background:var(--s1);color:var(--mu);font:600 .78rem Cairo;cursor:pointer}.fl button.on{background:var(--p);color:#fff;border-color:var(--p)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.rq{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;animation:up .45s var(--ease) both;transition:.25s;border-top:3px solid var(--warn)}
.rq:hover{box-shadow:0 14px 30px color-mix(in srgb,var(--p) 22%,transparent);transform:translateY(-3px)}
.rq.a{border-top-color:var(--ok)}.rq.r{border-top-color:var(--glow)}
.who{display:flex;gap:12px;align-items:center}.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font:900 1.1rem 'Playfair Display',serif;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.who b{display:block}.who small{color:var(--mu);font-size:.75rem}
.row{display:flex;justify-content:space-between;gap:10px;font-size:.82rem;flex-wrap:wrap}.row span:first-child{color:var(--mu)}
.rs{font-size:.8rem;color:var(--mu);background:var(--bg2);border-radius:8px;padding:9px 12px}
.pill{align-self:flex-start;padding:4px 12px;border-radius:99px;font-size:.7rem;font-weight:700;border:1px solid}
.pill.p{color:var(--warn);border-color:rgba(230,181,40,.4)}.pill.a{color:var(--ok);border-color:rgba(31,190,114,.4)}.pill.r{color:var(--glow);border-color:rgba(255,44,77,.4)}
.acts{display:flex;gap:10px}.acts button{flex:1;padding:11px;border:0;border-radius:8px;color:#fff;font:700 .85rem Cairo;cursor:pointer;transition:.2s}.acts button:hover{transform:translateY(-2px)}.acts button:disabled{opacity:.5}
.yes{background:var(--ok)}.no{background:var(--p)}
.sk{height:150px;border-radius:14px;background:var(--s1);border:1px solid var(--bd);position:relative;overflow:hidden}.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(212,175,106,.12) 50%,transparent 70%);transform:translateX(-100%);animation:skm 1.3s infinite}@keyframes skm{to{transform:translateX(100%)}}
.fl button b{background:var(--gold);color:#222;border-radius:99px;padding:0 7px;font-size:.68rem;margin-inline-start:6px}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:40px}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:8px;width:92%;max-width:380px;pointer-events:none}
.toast{background:var(--s1);border:1px solid var(--bd);border-inline-start:3px solid var(--ok);border-radius:10px;padding:12px 16px;font-size:.85rem;animation:up .4s var(--ease),out .4s 3.4s forwards}.toast.e{border-inline-start-color:var(--p)}
@keyframes out{to{opacity:0}}
@media(max-width:600px){.top{padding:10px 14px}#dash{padding:16px 12px}.list{grid-template-columns:1fr}.card{padding:26px 18px}.hero h2{font-size:1.2rem}}
</style>
</head>

ar:{pEntry:"دخول",pExit:"خروج",pMissing:"بيان عذر",tLeave:"الإجازات",tPerm:"الأذونات",pdate:"التاريخ · الوقت",sub:"بوابة المديرين",back:"← بوابة الموظفين",logout:"تسجيل الخروج",tl:"دخول",tr:"تسجيل",lt:"دخول المدير",ls:"استخدم كود المدير وكلمة المرور",rt:"تسجيل مدير",rs:"يجب أن يكون كودك مسجلاً كمدير",code:"كود المدير",pass:"كلمة المرور",pass2:"تأكيد كلمة المرور",search:"🔍 ابحث بالموظف أو القسم أو النوع...",fill:"يرجى ملء جميع الحقول",mism:"كلمتا المرور غير متطابقتين",short:"كلمة المرور 6 أحرف على الأقل",conn:"خطأ في الاتصال، حاول مجدداً",regOk:"تم التسجيل! يمكنك الدخول الآن",hi:"مرحباً،",hrN:"الموارد البشرية – الموافقة النهائية",mgN:"مدير القسم",todo:"بانتظار قرارك",approved:"تمت الموافقة",rejected:"مرفوضة",all:"الكل",total:"الإجمالي",empty:"لا توجد طلبات",type:"النوع",from:"من",to:"إلى",days:"يوم",dept:"القسم",ok:"✔ موافقة",no:"✘ رفض",cok:"الموافقة على هذا الطلب؟",cno:"رفض هذا الطلب؟",done:"تم حفظ القرار",newReq:"🔔 طلب جديد بانتظار قرارك",stPend:"بانتظار المدير",stMA:"وافق المدير",stMR:"رفض المدير",stHA:"وافقت الموارد البشرية",stHR:"رفضت الموارد البشرية"},tr:{pEntry:"Giriş",pExit:"Çıkış",pMissing:"Eksik Basım Mazereti",tLeave:"İzinler",tPerm:"Giriş/Çıkış",pdate:"Tarih · Saat",sub:"YÖNETİCİ PORTALI",back:"← Çalışan Portalı",logout:"Çıkış Yap",tl:"Giriş Yap",tr:"Kayıt",lt:"Yönetici girişi",ls:"Yönetici kodunuz ve şifrenizi kullanın",rt:"Yönetici kaydı",rs:"Kodunuz yönetici olarak tanımlı olmalı",code:"Yönetici Kodu",pass:"Şifre",pass2:"Şifre Tekrar",search:"🔍 Çalışan, bölüm, tür ara...",fill:"Lütfen tüm alanları doldurun",mism:"Şifreler eşleşmiyor",short:"Şifre en az 6 karakter olmalı",conn:"Bağlantı hatası, tekrar deneyin",regOk:"Kayıt tamam! Giriş yapabilirsiniz",hi:"Hoş geldiniz,",hrN:"İK – nihai onay",mgN:"Bölüm yöneticisi",todo:"İşlem bekleyen",approved:"Onaylandı",rejected:"Reddedildi",all:"Tümü",total:"Toplam",empty:"Talep yok",type:"Tür",from:"Başlangıç",to:"Bitiş",days:"gün",dept:"Bölüm",ok:"✔ Onayla",no:"✘ Reddet",cok:"Bu talep onaylansın mı?",cno:"Bu talep reddedilsin mi?",done:"Karar kaydedildi",newReq:"🔔 Kararınızı bekleyen yeni talep",stPend:"Yönetici bekleniyor",stMA:"Yönetici onayladı",stMR:"Yönetici reddetti",stHA:"İK onayladı",stHR:"İK reddetti"}};
const t=k=>T[lang][k]||k,$=id=>document.getElementById(id);
const esc=s=>{const d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML};
async function api(p){const u=new URL(URL_);Object.entries({...p,lang}).forEach(([k,v])=>u.searchParams.set(k,v));return (await fetch(u)).json()}
function toast(m,e){const x=document.createElement("div");x.className="toast"+(e?" e":"");x.textContent=m;$("toasts").appendChild(x);setTimeout(()=>x.remove(),3900)}
function al(m,ok){$("al").textContent=m;$("al").className="al show"+(ok?" ok":"")}
function setLang(l,first){lang=l;document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=t(e.dataset.ph));
  document.querySelectorAll("[data-l]").forEach(b=>b.classList.toggle("on",b.dataset.l===l));if(mc)paint();try{localStorage.setItem("rr_lang",l)}catch(e){}}
const TH={ruby:"#C0002A",ocean:"#1D6FE0",emerald:"#14946B",royal:"#7B3FE4",light:"#F6F1EC"};
function setTheme(x){document.documentElement.dataset.theme=x;document.querySelectorAll(".dot").forEach(d=>d.classList.toggle("on",d.dataset.th===x));try{localStorage.setItem("rr_theme",x)}catch(e){}}
$("dots").innerHTML=Object.entries(TH).map(([k,c])=>`<div class="dot" data-th="${k}" style="background:${c}" onclick="setTheme('${k}')"></div>`).join("");
function tab(x){const l=x==="l";$("fl").style.display=l?"block":"none";$("fr").style.display=l?"none":"block";document.querySelectorAll(".tabs button").forEach((b,i)=>b.classList.toggle("on",(i===0)===l));$("al").className="al"}
async function reg(){const c=$("rc").value.trim(),p=$("rp").value;if(!c||!p)return al(t("fill"));if(p!==$("rp2").value)return al(t("mism"));if(p.length<6)return al(t("short"));
  try{const r=await api({action:"managerRegister",code:c,password:p});if(r.success){al(t("regOk"),true);setTimeout(()=>tab("l"),1400)}else al(r.message)}catch(e){al(t("conn"))}}
async function login(){const c=$("lc").value.trim(),p=$("lp").value;if(!c||!p)return al(t("fill"));
  try{const r=await api({action:"managerLogin",code:c,password:p});if(r.success){mc=c;mp=p;me=r;sessionStorage.setItem("mgr",JSON.stringify({c,p}));enter()}else al(r.message)}catch(e){al(t("conn"))}}
function logout(){sessionStorage.removeItem("mgr");clearInterval(poll);mc=mp=null;cache={leave:null,perm:null};last={leave:-1,perm:-1};sig={};data=[];ty="leave";$("dash").classList.remove("show");$("auth").style.display="flex";$("lo").style.display="none"}
function enter(){$("auth").style.display="none";$("dash").classList.add("show");$("lo").style.display="";loadAll();clearInterval(poll);poll=setInterval(()=>{if(!document.hidden)loadAll()},30000)}
let cache={leave:null,perm:null},last={leave:-1,perm:-1},sig={};
async function load(k){k=k||ty;
  try{const r=await api({action:k==="leave"?"getManagerRequests":"getManagerPermissions",code:mc,password:mp});
    if(!mc)return;
    if(!r.success){if(!cache[k]&&k===ty){toast(r.message,1);if(/session|expired|انتهت/i.test(r.message))logout()}return}
    me=r;const n=r.data.filter(d=>d.actionable).length;
    if(last[k]>=0&&n>last[k])toast(t("newReq")+" ("+t(k==="leave"?"tLeave":"tPerm")+")");last[k]=n;
    const s=JSON.stringify(r.data);if(s===sig[k]&&cache[k])return;   // nothing changed → no repaint
    sig[k]=s;cache[k]=r.data;paintKinds();
    if(k===ty){data=r.data;paint()}
  }catch(e){}}
function loadAll(){load(ty);load(ty==="leave"?"perm":"leave")}
function setTy(k){if(k===ty)return;ty=k;filter="todo";data=cache[k]||[];paint();
  if(!cache[k])$("list").innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  load(k)}
const typeTxt=s=>s==="Entry"?t("pEntry"):s==="Exit"?t("pExit"):/^Missing Stamp/.test(s||"")?t("pMissing")+" ("+(/Entry/.test(s)?t("pEntry"):t("pExit"))+")":s;
const kind=s=>/approved/i.test(s)?"a":/rejected/i.test(s)?"r":"p";
const stTxt=s=>({"Pending":"stPend","Approved by Manager":"stMA","Rejected by Manager":"stMR","Approved by HR":"stHA","Rejected by HR":"stHR"}[s]?t({"Pending":"stPend","Approved by Manager":"stMA","Rejected by Manager":"stMR","Approved by HR":"stHA","Rejected by HR":"stHR"}[s]):s);
const dc=(s,e)=>s&&e&&e>=s?Math.round((new Date(e)-new Date(s))/864e5)+1:"";
function paintKinds(){$("kinds").innerHTML=[["leave","📋","tLeave"],["perm","🚪","tPerm"]].map(([k,i,l])=>{const n=(cache[k]||[]).filter(d=>d.actionable).length;return`<button class="${ty===k?"on":""}" onclick="setTy('${k}')">${i} ${t(l)}${n?`<b>${n}</b>`:""}</button>`}).join("")}
function paint(){paintKinds();$("wel").innerHTML=`${t("hi")} <b>${esc(me.name||mc)}</b>`;$("info").textContent=(me.role==="HR"?t("hrN"):t("mgN"))+" · "+mc;
  const c={todo:data.filter(d=>d.actionable).length,approved:data.filter(d=>kind(d.status)==="a").length,rejected:data.filter(d=>kind(d.status)==="r").length,all:data.length};
  const defs=[["todo","var(--warn)"],["approved","var(--ok)"],["rejected","var(--glow)"],["all","var(--gold)"]];
  $("stats").innerHTML=defs.map(([k,col])=>`<div class="st" style="--c:${col}" onclick="filter='${k}';render()"><div class="n">${c[k]}</div><div class="l">${t(k==="all"?"total":k)}</div></div>`).join("");
  $("fl2").innerHTML=["todo","approved","rejected","all"].map(k=>`<button class="${filter===k?"on":""}" onclick="filter='${k}';render()">${t(k)}</button>`).join("");render()}
function render(){document.querySelectorAll("#fl2 button").forEach((b,i)=>b.classList.toggle("on",["todo","approved","rejected","all"][i]===filter));
  const q=$("q").value.toLowerCase();
  const l=data.filter(d=>(filter==="all"||(filter==="todo"?d.actionable:filter==="approved"?kind(d.status)==="a":kind(d.status)==="r"))&&(d.name+d.dept+d.type+d.code+d.job).toLowerCase().includes(q)).reverse();
  $("list").innerHTML=l.length?l.map((d,i)=>`<div class="rq ${kind(d.status)}" style="animation-delay:${Math.min(i,10)*40}ms">
  <div class="who"><div class="av">${esc(String(d.name||"?").trim().charAt(0))}</div><div><b>${esc(d.name)}</b><small>${esc(d.code)} · ${esc(d.job)}</small></div></div>
  <div class="row"><span>${t("dept")}</span><span>${esc(d.dept)}</span></div>
  <div class="row"><span>${t("type")}</span><span>${esc(typeTxt(d.type))}</span></div>
  ${d.time!==undefined?`<div class="row"><span>${t("pdate")}</span><span>${esc(d.start)} · ${esc(d.time)}</span></div>`:`<div class="row"><span>${t("from")} → ${t("to")}</span><span>${esc(d.start)} → ${esc(d.end)} ${dc(d.start,d.end)?`(${dc(d.start,d.end)} ${t("days")})`:""}</span></div>`}
  ${d.reason?`<div class="rs">${esc(d.reason)}</div>`:""}
  <span class="pill ${kind(d.status)}">${esc(stTxt(d.status))}</span>
  ${d.actionable?`<div class="acts"><button class="yes" onclick="decide(${d.row},'approve',this)">${t("ok")}</button><button class="no" onclick="decide(${d.row},'reject',this)">${t("no")}</button></div>`:""}</div>`).join(""):`<div class="empty">${t("empty")}</div>`}
async function decide(row,dec,btn){if(!confirm(t(dec==="approve"?"cok":"cno")))return;btn.parentNode.querySelectorAll("button").forEach(b=>b.disabled=true);
  try{const r=await api({action:ty==="leave"?"decideLeave":"decidePermission",code:mc,password:mp,row,decision:dec});if(r.success){toast("✅ "+t("done"));const it=data.find(x=>x.row===row);if(it){it.actionable=false;it.status=(dec==="approve"?"Approved":"Rejected")+(me.role==="HR"?" by HR":" by Manager");sig[ty]="";paint()}}else toast(r.message,1);load()}catch(e){toast(t("conn"),1);load()}}
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&!mc&&document.activeElement.tagName==="INPUT")$("fl").style.display!=="none"?login():reg()});
window.onload=()=>{let l="en",th="ruby";try{l=localStorage.getItem("rr_lang")||"en";th=localStorage.getItem("rr_theme")||"ruby"}catch(e){}
  setTheme(th);setLang(l,1);try{const s=JSON.parse(sessionStorage.getItem("mgr")||"null");if(s){mc=s.c;mp=s.p;enter()}}catch(e){}};
</script>
</body></html>
